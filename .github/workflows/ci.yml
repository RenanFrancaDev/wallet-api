name: CI

# Pipeline em jobs separados (cada um falha e aparece no PR de forma independente):
#
#   Qualidade -> Testes unitarios ----\
#              -> Testes de integracao -> Build -> Build e testes (portao final)
#
# Os testes de integracao (Testcontainers) sobem um Oracle de verdade em Docker e rodam em paralelo
# com os unitarios, que sao rapidos e nao precisam de Docker.
#
# O job "Build e testes" e o UNICO exigido pela protecao de branch. Ele so passa se todos os outros
# passarem; assim os jobs podem ser renomeados ou acrescentados sem mexer na regra do GitHub.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

# Um push novo na mesma branch cancela a execucao anterior que ainda esta rodando.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Qualidade (formato, lint e tipos)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar o Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven # guarda ~/.m2 entre execucoes (o "node_modules" global do Maven)

      # Falha se algum arquivo nao estiver formatado. Correcao local: ./mvnw spotless:apply
      - name: Formatacao (Spotless)
        run: ./mvnw -B -ntp spotless:check

      # Falha com qualquer violacao das regras de config/checkstyle/checkstyle.xml.
      - name: Lint (Checkstyle)
        run: ./mvnw -B -ntp checkstyle:check

      # Em Java o "typecheck" e o compilador. O pom.xml liga -Xlint:all e failOnWarning:
      # qualquer aviso do compilador (no codigo e nos testes) quebra o build.
      - name: Compilacao estrita (tipos)
        run: ./mvnw -B -ntp test-compile

  testes:
    name: Testes unitarios
    runs-on: ubuntu-latest
    needs: qualidade # nao gasta tempo de teste se o codigo nem passa na qualidade
    timeout-minutes: 15

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar o Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # So a fase "test": formato e lint ja rodaram no job anterior.
      - name: Testes unitarios (JUnit)
        run: ./mvnw -B -ntp test

      # Resumo na pagina da execucao (soma dos relatorios do surefire).
      - name: Resumo dos testes
        if: always()
        run: |
          {
            echo "### Testes unitarios"
            grep -h "Tests run:" target/surefire-reports/*.txt 2>/dev/null | awk -F'[:,]' '
              { total += $2; falhas += $4; erros += $6; ignorados += $8 }
              END { printf "- Executados: %d\n- Falhas: %d\n- Erros: %d\n- Ignorados: %d\n", total, falhas, erros, ignorados }'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar os relatorios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste
          path: target/surefire-reports/
          retention-days: 7

      # Dados brutos da cobertura dos unitarios; o job "Cobertura" junta com os da integracao.
      - name: Guardar os dados de cobertura (unitarios)
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-unitarios
          path: target/jacoco.exec
          retention-days: 1

  integracao:
    name: Testes de integracao (Oracle real)
    runs-on: ubuntu-latest
    needs: qualidade
    timeout-minutes: 30 # baixar a imagem do Oracle e subir o banco levam alguns minutos

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar o Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # O runner ubuntu ja tem Docker. O Testcontainers sobe o Oracle (gvenzl/oracle-free, tag fixa) com os
      # 3 usuarios criados por db/init/01_usuarios.sh, e a aplicacao roda inteira contra ele.
      # Roda so as classes *IT (failsafe); os unitarios ja rodam no job "Testes unitarios".
      - name: Testes de integracao (Testcontainers)
        run: ./mvnw -B -ntp test-compile failsafe:integration-test failsafe:verify

      - name: Guardar os relatorios de integracao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-integracao
          path: target/failsafe-reports/
          retention-days: 7

      - name: Guardar os dados de cobertura (integracao)
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-integracao
          path: target/jacoco-it.exec
          retention-days: 1

  cobertura:
    name: Cobertura (piso do JaCoCo)
    runs-on: ubuntu-latest
    needs: [testes, integracao]
    timeout-minutes: 10

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar o Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Os dois .exec (unitarios e integracao) caem em target/, onde o JaCoCo espera.
      - name: Baixar os dados de cobertura
        uses: actions/download-artifact@v4
        with:
          pattern: cobertura-*
          path: target
          merge-multiple: true

      # Compila (o JaCoCo precisa das classes), junta os dois arquivos, gera o relatorio e confere o piso
      # definido no pom.xml (linhas 90% e ramos 80%). Falha se a cobertura cair abaixo.
      - name: Juntar, relatar e conferir o piso
        run: ./mvnw -B -ntp -DskipTests compile jacoco:merge@juntar jacoco:report@relatorio jacoco:check@piso

      - name: Resumo da cobertura
        run: |
          {
            echo "### Cobertura (unitarios + integracao)"
            awk -F, 'NR>1 { lm+=$8; lc+=$9; bm+=$6; bc+=$7 }
              END { printf "- Linhas: %.1f%% (%d de %d)\n- Ramos: %.1f%% (%d de %d)\n", 100*lc/(lc+lm), lc, lc+lm, 100*bc/(bc+bm), bc, bc+bm }' target/site/jacoco/jacoco.csv
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar o relatorio HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-de-cobertura
          path: target/site/jacoco/
          retention-days: 7

  build:
    name: Build (empacotar o jar)
    runs-on: ubuntu-latest
    needs: [testes, integracao, cobertura]
    timeout-minutes: 10

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar o Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Garante que o jar executavel (Spring Boot) e gerado. Os testes ja rodaram no job anterior.
      - name: Empacotar
        run: ./mvnw -B -ntp -DskipTests package

  # Portao final: unico check exigido pela protecao de branch.
  # "if: always()" faz o job rodar mesmo quando um anterior falha, para ele reportar a falha em vez de ficar "pulado".
  build-e-testes:
    name: Build e testes
    runs-on: ubuntu-latest
    needs: [qualidade, testes, integracao, cobertura, build]
    if: always()

    steps:
      - name: Conferir o resultado de todos os jobs
        run: |
          echo "Qualidade:  ${{ needs.qualidade.result }}"
          echo "Testes:     ${{ needs.testes.result }}"
          echo "Integracao: ${{ needs.integracao.result }}"
          echo "Cobertura:  ${{ needs.cobertura.result }}"
          echo "Build:      ${{ needs.build.result }}"
          if [ "${{ needs.qualidade.result }}" != "success" ] || \
             [ "${{ needs.testes.result }}" != "success" ] || \
             [ "${{ needs.integracao.result }}" != "success" ] || \
             [ "${{ needs.cobertura.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ]; then
            echo "Algum job falhou ou foi cancelado."
            exit 1
          fi
