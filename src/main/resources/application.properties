spring.application.name=wallet-api

# As senhas vem do mesmo .env usado pelo docker compose (arquivo opcional: em container ou CI
# as mesmas variaveis podem vir do ambiente). O .env nunca vai para o Git.
spring.config.import=optional:file:.env[.properties]

# Conexao da APLICACAO: usuario de privilegio minimo (so EXECUTE no package e SELECT nas views).
spring.datasource.url=jdbc:oracle:thin:@//${DB_HOST:localhost}:${DB_PORT:1521}/${DB_SERVICE:FREEPDB1}
spring.datasource.username=WALLET_APP
spring.datasource.password=${WALLET_APP_PASSWORD}

# O Flyway NAO roda pela autoconfiguracao do Spring (ela usa um unico usuario e um unico conjunto
# de migrations). Quem executa e a classe FlywayConfig: primeiro o conjunto audit (como
# WALLET_AUDIT), depois o owner (como WALLET_OWNER). Nunca com o usuario da aplicacao.
spring.flyway.enabled=false
wallet.flyway.audit-user=WALLET_AUDIT
wallet.flyway.audit-password=${WALLET_AUDIT_PASSWORD}
wallet.flyway.owner-user=WALLET_OWNER
wallet.flyway.owner-password=${WALLET_OWNER_PASSWORD}

# Actuator: so o necessario.
management.endpoints.web.exposure.include=health,info

# Autenticacao da API: header X-API-Key. A chave vem do .env (variavel WALLET_API_KEY) e tem de ter 16+ caracteres.
# Sem a variavel a aplicacao NAO sobe: nunca existe "API aberta por esquecimento".
wallet.api-key=${WALLET_API_KEY}
